# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/accessiblelifeapi?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Elaine#1976
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# We already created tables manually; don't let Hibernate modify them
spring.jpa.hibernate.ddl-auto=none

# Show SQL queries in console
spring.jpa.show-sql=true

# Specify Hibernate dialect explicitly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Optional Logging Settings
# ===============================
# Set logging level for SQL queries if needed
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Server Port (optional)
# ===============================
server.port=8080


